<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">
    <head>
        <title>[[#{app.title}]] - search</title>
    </head>
    <body>
        <div layout:fragment="content">
            <h1 class="mb-4" th:text="${search.id}">Search ID...</h1>
            <p th:text="${'totalItems: ' + search.totalItems}">Total items...</p>
            <table class="table table-striped table-condensed">
                <tr th:each="member,meta : ${search.member}">
                    <td>
                        <a
                            th:text="${member.preferredName}"
                            th:href="@{'/gnd/' + ${member.gndIdentifier}}">
                            Name...
                        </a>
                    </td>
                    <td th:text="${suggest.array[meta.index].category}">Type...</td>
                    <td th:text="${#strings.substringAfter(suggest.array[meta.index].label,'| ')}">
                        Details...
                    </td>
                    <td th:text="${member.gndIdentifier}">ID...</td>
                </tr>
            </table>
        </div>
    </body>
</html>
