<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">
    <head>
        <title>[[#{app.title}]] - search</title>
    </head>
    <body>
        <th:block th:fragment="pageLink(size)">
            <a
                th:href="@{/gnd/search(q=${request.q}, from=${request.from}, size=${size})}"
                th:text="${size}"
                >10</a
            >
        </th:block>
        <div layout:fragment="content">
            <h1 class="mb-4" th:text="${search.id}">Search ID...</h1>
            <p>
                <span th:text="${'totalItems: ' + search.totalItems}">Total items...</span>,
                <span th:text="${'from: ' + request.from}">From...</span>,
                <span th:text="${'size: ' + request.size}">Size...</span> |
                <th:block th:insert="~{::pageLink(10)}" />,
                <th:block th:insert="~{::pageLink(30)}" />,
                <th:block th:insert="~{::pageLink(50)}" />,
                <th:block th:insert="~{::pageLink(100)}" />
                |
                <a
                    th:href="@{/gnd/search(
                        q=${request.q},
                        size=${request.size},
                        from=${@pagination.prevFrom(request.from, request.size)})}"
                    >&larr; prev</a
                >,
                <a
                    th:href="@{/gnd/search(
                        q=${request.q}, 
                        size=${request.size}, 
                        from=${@pagination.nextFrom(search.totalItems, request.from, request.size)})}"
                    >next &rarr;</a
                >
            </p>

            <table class="table table-striped table-condensed">
                <tr th:each="member,meta : ${search.member}">
                    <td>
                        <a
                            th:text="${member.preferredName}"
                            th:href="@{'/gnd/' + ${member.gndIdentifier}}">
                            Name...
                        </a>
                    </td>
                    <td th:text="${suggest.array[meta.index].category}">Type...</td>
                    <td th:text="${#strings.substringAfter(suggest.array[meta.index].label,'| ')}">
                        Details...
                    </td>
                    <td th:text="${member.gndIdentifier}">ID...</td>
                </tr>
            </table>
        </div>
    </body>
</html>
