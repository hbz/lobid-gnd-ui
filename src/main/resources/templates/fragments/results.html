<table th:fragment="resultsTable" class="table table-striped table-condensed">
    <tr>
        <th />
        <th id="name-column" />
        <th />
        <th />
        <th id="id-column" />
    </tr>
    <tr th:each="member,meta : ${search.member}">
        <td>
            <i th:class="${@icons.iconClass(member.type)}" />
        </td>
        <td>
            <a th:text="${member.preferredName}" th:href="@{'/gnd/' + ${member.gndIdentifier}}">
                Name...
            </a>
        </td>
        <td th:text="${suggest.array[meta.index].category}">Type...</td>
        <td th:text="${#strings.substringAfter(suggest.array[meta.index].label,'| ')}">
            Details...
        </td>
        <td th:text="${member.gndIdentifier}" th:classappend="text-muted">ID...</td>
    </tr>
</table>
